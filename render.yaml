databases:
  - name: nutrition-coach-db
    plan: free
    databaseName: nutrition_coach
    user: nutrition_coach

services:
  - type: web
    name: nutrition-coach-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-coach-db
          property: connectionString
      # Render injects its same-region internal private-network URL here.
      # This academic deployment therefore leaves DATABASE_SSL unset.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: USDA_FDC_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: COOKIE_SIGNING_SECRET
        generateValue: true
